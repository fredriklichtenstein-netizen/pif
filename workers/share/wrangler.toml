# Share-link Worker (see src/index.ts). Deployed by
# .github/workflows/deploy-share-worker.yml. Hostnames are attached as
# Custom Domains in the Cloudflare dashboard (the CI token has no zone/DNS
# permissions); wrangler leaves dashboard-attached domains alone because no
# routes are declared here.
name = "pif-share"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = true

# Production: app.pif.community (cut-over replaces Hado's DNS record).
